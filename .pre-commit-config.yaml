repos:
  - repo: local
    hooks:
      - id: nixfmt
        name: nixfmt
        entry: nixfmt-rfc-style
        language: system
        files: \.nix$
      - id: deadnix
        name: deadnix
        entry: deadnix --edit
        language: system
        files: \.nix$
      - id: statix
        name: statix
        entry: statix fix
        language: system
        files: \.nix$
      - id: treefmt
        name: treefmt
        entry: treefmt --fail-on-change
        language: system
        pass_filenames: false
        always_run: true
