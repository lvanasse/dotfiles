[formatter.nixfmt]
command = "nixfmt-rfc-style"
includes = ["*.nix"]

[formatter.prettier]
command = "prettier"
options = ["--write"]
includes = ["*.json", "*.md", "*.yaml", "*.yml"]

[formatter.shfmt]
command = "shfmt"
options = ["-i", "2", "-w"]
includes = ["*.sh"]

[global]
excludes = [
  "*.lock",
  "*.age", 
  "result*",
  ".git/**",
  "tmp/**",
  "wallpapers/**"
]